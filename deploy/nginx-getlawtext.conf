# /etc/nginx/conf.d/getlawtext.conf  (또는 기존 server { } 블록 안에 location 만 추가)
# 외부 경로 /getlawtext/mcp  →  내부 http://127.0.0.1:8087/mcp

upstream getlawtext {
    server 127.0.0.1:8087;          # MCP 서버가 다른 호스트면 그 주소:8087
    keepalive 16;
}

server {
    listen 80;                      # 운영에서는 443 ssl + 인증서 설정 권장
    server_name _;

    # 정확히 /getlawtext/mcp 만 전달 (끝에 / 가 붙은 요청도 같은 곳으로)
    location = /getlawtext/mcp  { proxy_pass http://getlawtext/mcp; include /etc/nginx/getlawtext-proxy.inc; }
    location = /getlawtext/mcp/ { proxy_pass http://getlawtext/mcp; include /etc/nginx/getlawtext-proxy.inc; }
}
