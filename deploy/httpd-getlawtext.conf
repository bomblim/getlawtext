# /etc/httpd/conf.d/getlawtext.conf  (RHEL httpd: mod_proxy, mod_proxy_http 기본 포함)
# 외부 경로 /getlawtext/mcp  →  내부 http://127.0.0.1:8087/mcp
# 기존 <VirtualHost> 안에 넣거나, 이 파일 그대로 conf.d 에 두면 기본 서버에 적용됩니다.

ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 3600

# /getlawtext/mcp 와 /getlawtext/mcp/ 둘 다 /mcp 로 전달. flushpackets=on → 스트리밍(SSE) 즉시 전달
# 주의: ProxyPassMatch 는 대상에 $1 같은 역참조가 없으면 원래 경로를 뒤에 덧붙이므로 반드시 캡처 그룹을 씁니다.
ProxyPassMatch "^/getlawtext/(mcp)/?$" "http://127.0.0.1:8087/$1" flushpackets=on keepalive=On timeout=3600
ProxyPassReverse "/getlawtext/mcp" "http://127.0.0.1:8087/mcp"

<LocationMatch "^/getlawtext/mcp/?$">
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    # 압축이 켜져 있으면 스트리밍이 버퍼링될 수 있어 끔
    SetEnv no-gzip 1
</LocationMatch>
